services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    expose:
      - "8000"
    volumes: !reset []

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - stock_news_net

volumes:
  caddy_data:
  caddy_config:

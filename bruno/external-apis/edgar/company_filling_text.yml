info:
  name: company_filling_text
  type: http
  seq: 2

http:
  method: GET
  url: https://www.sec.gov/Archives/edgar/data/883241/000088324126000018/snps-20260430.htm
  headers:
    - name: User-Agent
      value: "{{user_agent}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("body is non-empty", function () {
          expect(res.getBody().length).to.be.greaterThan(0);
        });

        test("HTML document content", function () {
          expect(res.getBody().toLowerCase()).to.include("<html");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: text/html

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

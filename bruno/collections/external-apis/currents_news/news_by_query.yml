info:
  name: news_by_query
  type: http
  seq: 1

http:
  method: GET
  url: https://api.currentsapi.services/v1/search?query=(Synopsys OR SNPS)
  params:
    - name: query
      value: (Synopsys OR SNPS)
      type: query
    - name: language
      value: en
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{currents-api-key}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("news is a non-empty array", function () {
          const body = res.getBody();
          expect(body).to.have.property('news');
          expect(body.news).to.be.an('array');
          expect(body.news.length).to.be.greaterThan(0);
        });

        test("each article has the expected fields", function () {
          const articles = res.getBody().news;
          articles.forEach(function (article) {
            expect(article).to.have.property('title');
            expect(article).to.have.property('url');
            expect(article).to.have.property('published');
          });
        });

        test("results mentioning the terms Synopsys or SNPS", function () {
          const articles = res.getBody().news;
          const terms = ["synopsys", "snps"];
          const anyMatch = articles.some(function (article) {
            const text = (
              (article.title || "") + " " + (article.description || "")
            ).toLowerCase();
            return terms.some(term => text.includes(term));
          });
          expect(anyMatch).to.be.true;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.body.status
      operator: eq
      value: ok

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

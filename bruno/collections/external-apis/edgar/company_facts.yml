info:
  name: company_facts
  type: http
  seq: 3

http:
  method: GET
  url: https://data.sec.gov/api/xbrl/companyfacts/CIK{{CIK_SNPS}}.json
  headers:
    - name: User-Agent
      value: "{{user_agent}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("us-gaap facts include at least one revenue-related tag", function () {
          const usGaapFacts = res.getBody().facts["us-gaap"];
          const hasRevenueTag = Object.keys(usGaapFacts).some((tag) =>
            tag.toLowerCase().includes("revenues")
          );
          expect(hasRevenueTag).to.be.true;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.facts
      operator: isDefined
    - expression: res.body.facts.us-gaap
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: stock_prices
  type: http
  seq: 1

http:
  method: GET
  url: "{{base-url}}/companies/{{cik}}/prices"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "\tapplication/json"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

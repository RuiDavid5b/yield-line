info:
  name: ask_agent
  type: http
  seq: 1

http:
  method: POST
  url: "{{base-url}}/agent/ask"
  body:
    type: json
    data: |-
      {
        "question": "How has Synopsys performed relative to its peers recently?"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "\tapplication/json"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

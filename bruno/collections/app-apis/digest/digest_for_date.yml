info:
  name: digest_for_date
  type: http
  seq: 2

http:
  method: GET
  url: "{{base-url}}/digest/{{date}}"
  auth: inherit

runtime:
  variables:
    - name: date
      value: 2026-08-24
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "\tapplication/json"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

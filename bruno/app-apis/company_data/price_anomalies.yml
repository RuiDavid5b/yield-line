info:
  name: price_anomalies
  type: http
  seq: 5

http:
  method: GET
  url: "{{base-url}}/companies/{{cik}}/anomalies"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "\tapplication/json"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

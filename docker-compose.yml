services:
  postgres:
    image: postgres:18.4-alpine3.24
    networks: [stock_news_net]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.10.0-alpine
    networks: [stock_news_net]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
      - api/.env
    networks:
      - stock_news_net
 
volumes:
  postgres_data:
  redis_data:

networks:
  stock_news_net:
    name: stock_news_net

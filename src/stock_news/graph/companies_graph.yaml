edges:
  - source: NVDA
    target: TSM
    edge_type: customer_of
    context: "TSM fabricates NVDA's leading-edge GPU dies"

  - source: ASML
    target: TSM
    edge_type: supplies_to
    context: "ASML supplies EUV lithography systems used in TSM's advanced nodes"

  - source: CDNS
    target: SNPS
    edge_type: competes_with
    context: "Both offer EDA tooling for chip design and verification"

  - source: CDNS
    target: ARM
    edge_type: competes_with
    context: "Both license semiconductor IP, though Cadence's core business is EDA tooling and Arm's is IP licensing"

  - source: TSM
    target: AMKR
    edge_type: customer_of
    context: "AMKR provides outsourced packaging and test for some of TSM's manufactured chips"

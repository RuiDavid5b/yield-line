# Seed graph: curated companies and typed relationships.
# This file is the source of truth for the company universe and the
# knowledge graph the LangGraph agent uses for context.
#
# Edges are directional unless edge_type is inherently symmetric
# (competes_with). Both source and target must reference companies
# defined in this file - relationships to untracked companies belong
# in the pending_edges DB table instead, pending promotion here.

companies:
  - cik: "0001045810"
    ticker: NVDA
    name: NVIDIA Corporation
    industry_segment: fabless
    aliases: ["Nvidia"]
    reporting_currency: USD
    notes: "GPU/AI accelerator design; fabless, relies on TSMC for leading-edge nodes."

  - cik: "0000937966"
    ticker: ASML
    name: ASML Holding NV
    industry_segment: equipment
    aliases: []

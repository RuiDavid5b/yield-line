name: Build and deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      start_airflow:
        description: "Start Airflow services (recommended with 4+ GiB RAM)"
        required: true
        default: false
        type: boolean

  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ENVIRONMENT: staging

  ECR_BACKEND_REPOSITORY: yieldline-staging-backend
  ECR_API_REPOSITORY: yieldline-staging-api
  ECR_FRONTEND_REPOSITORY: yieldline-staging-frontend
  ECR_AIRFLOW_REPOSITORY: yieldline-staging-airflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.vars.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ steps.vars.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.vars.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest
          build-args: |
            VITE_API_URL=${{ vars.STAGING_API_URL }}

      - name: Build and push Airflow image
        uses: docker/build-push-action@v6
        with:
          context: ./airflow
          file: ./airflow/Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_AIRFLOW_REPOSITORY }}:${{ steps.vars.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_AIRFLOW_REPOSITORY }}:latest

  deploy:
    #if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      START_AIRFLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.start_airflow || false }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy YieldLine ${IMAGE_TAG}" \
            --parameters 'commands=[
              "set -euo pipefail",

              "cd /opt/yieldline",

              "git config --global --add safe.directory /opt/yieldline",

              "git fetch origin '"$GITHUB_SHA"'",
              "git reset --hard '"$GITHUB_SHA"'",

              "export AWS_REGION='"$AWS_REGION"'",
              "export ENVIRONMENT='"$ENVIRONMENT"'",
              "export IMAGE_TAG='"$IMAGE_TAG"'",
              "export START_AIRFLOW='"$START_AIRFLOW"'",

              "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)",
              "export ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com",

              "TOKEN=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H \"X-aws-ec2-metadata-token-ttl-seconds: 21600\")",
              "PUBLIC_IP=$(curl -sS -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/public-ipv4)",
              "export PUBLIC_IP=$(printf \"%s\" \"$PUBLIC_IP\" | tr \".\" \"-\")",

              "sudo /opt/yieldline/deploy/load-runtime-env.sh",

              "echo \"DOCKER_GID=$(stat -c \"%g\" /var/run/docker.sock)\" | sudo tee /opt/yieldline/airflow/.env >/dev/null",
              "sudo chown root:root /opt/yieldline/airflow/.env",
              "sudo chmod 600 /opt/yieldline/airflow/.env",

              "aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"",

              "docker compose -f docker-compose.yml -f docker-compose.staging.yml pull",
              "docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans",

              "if [ \"$START_AIRFLOW\" = \"true\" ]; then
                docker compose \
                  -f airflow/docker-compose.yml \
                  -f airflow/docker-compose.staging.yml \
                  pull

                docker compose \
                  -f airflow/docker-compose.yml \
                  -f airflow/docker-compose.staging.yml \
                  up -d --remove-orphans
              fi",

              "docker image prune -af --filter \"until=24h\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json

            exit 1
          fi

          echo "Deployment completed successfully."

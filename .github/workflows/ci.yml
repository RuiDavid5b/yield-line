name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Flake8
        run: uv run flake8 src tests

  tests:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.0-alpine
        ports:
          - "6379:6379"
        volumes:
          - redis_data:/data
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v

  airflow-dag-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t stock-news-airflow-test -f airflow/Dockerfile airflow/
      - run: >
          docker run --rm --entrypoint pytest
          -v ${{ github.workspace }}/airflow/dags:/opt/airflow/dags
          -v ${{ github.workspace }}/airflow/tests:/opt/airflow/tests
          stock-news-airflow-test /opt/airflow/tests/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.11",
    "lxml>=6.1.1",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy>=2.0.51",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "requires_env(*names): skip test unless all named env vars are set, in addition to DATABASE_URL",
]

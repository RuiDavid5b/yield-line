[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

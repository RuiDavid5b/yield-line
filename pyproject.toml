[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "langchain-groq>=1.1.3",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
